name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      pull-requests: write  # For PR comments
      actions: read         # For workflow artifacts
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Ensure Yarn classic (v1)
        run: |
          if ! command -v yarn >/dev/null 2>&1; then
            npm i -g yarn@1.22.22
          else
            if ! yarn --version | grep -Eq '^1\.'; then
              npm i -g yarn@1.22.22
            fi
          fi
          yarn --version

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run linter
        run: yarn lint

      - name: Run tests with coverage
        run: yarn test:coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-purrfect-chess
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Archive coverage results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

      - name: Comment PR with test results
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request' && always()
        with:
          script: |
            const fs = require('fs');
            
            // Read coverage summary if it exists
            let coverageComment = '### Test Results\n\n';
            
            try {
              const coverage = JSON.parse(fs.readFileSync('./coverage/coverage-summary.json', 'utf8'));
              const total = coverage.total;
              
              coverageComment += '| Metric | Coverage |\n';
              coverageComment += '|--------|----------|\n';
              coverageComment += `| Lines | ${total.lines.pct}% |\n`;
              coverageComment += `| Statements | ${total.statements.pct}% |\n`;
              coverageComment += `| Functions | ${total.functions.pct}% |\n`;
              coverageComment += `| Branches | ${total.branches.pct}% |\n`;
            } catch (error) {
              coverageComment += 'Coverage report not available.\n';
            }
            
            // Find existing comment to update or create new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('### Test Results')
            );
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: coverageComment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: coverageComment
              });
            }

  build:
    name: Build Check
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      actions: write  # For uploading artifacts
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Ensure Yarn classic (v1)
        run: |
          if ! command -v yarn >/dev/null 2>&1; then
            npm i -g yarn@1.22.22
          else
            if ! yarn --version | grep -Eq '^1\.'; then
              npm i -g yarn@1.22.22
            fi
          fi
          yarn --version

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build production
        run: yarn build

      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: .next/
          retention-days: 7

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      actions: write  # For uploading artifacts
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Ensure Yarn classic (v1)
        run: |
          if ! command -v yarn >/dev/null 2>&1; then
            npm i -g yarn@1.22.22
          else
            if ! yarn --version | grep -Eq '^1\.'; then
              npm i -g yarn@1.22.22
            fi
          fi
          yarn --version

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: yarn test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results
          path: test-results/
          retention-days: 30

  e2e-multiplayer:
    name: E2E Multiplayer Tests
    runs-on: ubuntu-latest
    # Only run if Supabase secrets are configured
    if: ${{ vars.SUPABASE_TEST_URL != '' && secrets.SUPABASE_TEST_ANON_KEY != '' }}
    
    permissions:
      contents: read
      actions: write  # For uploading artifacts
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Ensure Yarn classic (v1)
        run: |
          if ! command -v yarn >/dev/null 2>&1; then
            npm i -g yarn@1.22.22
          else
            if ! yarn --version | grep -Eq '^1\.'; then
              npm i -g yarn@1.22.22
            fi
          fi
          yarn --version

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Multiplayer E2E tests
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_TEST_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
        run: yarn test:e2e e2e/multiplayer.spec.ts

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-multiplayer
          path: playwright-report/
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-multiplayer-test-results
          path: test-results/
          retention-days: 30
